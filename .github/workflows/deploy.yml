name: Deploy VitePress

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write


jobs:

  deploy:

    environment:
      name: github-pages

    runs-on: ubuntu-latest


    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm


      - name: Install
        run: npm install


      - name: Build
        run: npm run docs:build


      - name: Upload Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist


      - name: Deploy
        uses: actions/deploy-pages@v4
